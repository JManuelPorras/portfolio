<!doctype html><html><head><meta charset="utf-8"><style>
 *{margin:0;padding:0}html,body{width:600px;height:600px;overflow:hidden}
 .b{width:600px;height:600px;position:relative;display:grid;place-items:center;
   background:linear-gradient(135deg,#0B1A2D 0%,#15304D 40%,#1F3A5F 70%,#27517F 100%);
   font-family:"Segoe UI",Arial,sans-serif}
 .g{position:absolute;inset:0;opacity:.10;
   background-image:linear-gradient(#9fc6e8 1px,transparent 1px),linear-gradient(90deg,#9fc6e8 1px,transparent 1px);
   background-size:42px 42px}
 .m{font-size:230px;font-weight:800;color:rgba(255,255,255,.16);letter-spacing:4px}
 .t{position:absolute;bottom:54px;left:0;right:0;text-align:center;color:#9fc6e8;
   font-size:20px;letter-spacing:3px;text-transform:uppercase}
</style></head><body>
 <div class="b"><div class="g"></div><div class="m">JMP</div>
 <div class="t">Jose Manuel Porras</div></div>
</body></html>
