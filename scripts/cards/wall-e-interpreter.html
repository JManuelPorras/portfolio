<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
 .canvas{display:grid;grid-template-columns:repeat(11,23px);grid-template-rows:repeat(11,23px);gap:3px}
 .canvas i{width:23px;height:23px;border-radius:4px;background:rgba(255,255,255,.06);display:block}
 .canvas i.c{background:#5CC8F5;box-shadow:0 0 7px rgba(92,200,245,.7)}
 .canvas i.v{background:#7C6DF2}
 .canvas i.y{background:#ffd36b;box-shadow:0 0 9px rgba(255,211,107,.8)}
</style></head><body>
<div class="card"><div class="grid"></div>
  <div class="tag">Language Design · C#</div>
  <div class="title">Wall-E Interpreter</div>
  <div style="margin-top:10px;font-size:18px;color:#cfe0f0;max-width:560px">
    A pixel-art programming language, built from scratch — lexer · parser · semantics · WPF canvas.
  </div>

  <div style="display:flex;gap:38px;margin-top:30px;align-items:center">
    <div class="mono" style="background:#0b1726;border:1px solid rgba(160,200,235,.22);border-radius:12px;
         padding:18px 22px;font-size:16px;line-height:1.65;color:#dbe9f6;width:400px">
      <span style="color:#7C6DF2">Spawn</span>(5, 5)<br/>
      <span style="color:#7C6DF2">Color</span>(<span style="color:#5CC8F5">"Blue"</span>)<br/>
      <span style="color:#7C6DF2">DrawCircle</span>(0, 1, 4)<br/>
      <span style="color:#9fc6e8">loop</span> i = 0 <span style="color:#9fc6e8">to</span> n …
    </div>
    <div>
      <div class="canvas" id="cv"></div>
      <div class="mono" style="font-size:13px;color:#9fc6e8;margin-top:8px;text-align:center">canvas output</div>
    </div>
  </div>

  <div class="repo">github.com/JManuelPorras/wall-e-interpreter</div>
</div>
<script>
 const cv=document.getElementById('cv');
 const on={}, set=(x,y,c)=>{on[y*11+x]=c};
 const circ=[[3,1],[4,1],[6,1],[7,1],[2,2],[8,2],[1,3],[9,3],[1,4],[9,4],[1,5],[9,5],[1,6],[9,6],[1,7],[9,7],[2,8],[8,8],[3,9],[4,9],[6,9],[7,9],[5,0],[5,10],[0,5],[10,5]];
 circ.forEach(p=>set(p[0],p[1],'c'));
 for(let k=0;k<11;k++){ if(!on[k*11+k]) set(k,k,'v'); }
 set(5,5,'y');
 let html='';
 for(let i=0;i<121;i++){ html+='<i'+(on[i]?(' class="'+on[i]+'"'):'')+'></i>'; }
 cv.innerHTML=html;
</script>
</body></html>
